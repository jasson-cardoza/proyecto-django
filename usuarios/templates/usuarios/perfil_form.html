{% extends 'base.html' %}
{% block title %}Editar perfil | ReciclaCerca{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <h2 class="titulo-seccion">Editar perfil</h2>
    <form method="post" class="card card-body shadow-sm form-reciclaje">
      {% csrf_token %}
      {% include 'includes/campos.html' %}
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-reciclaje">Guardar cambios</button>
        <a href="{% url 'usuarios:perfil_detail' perfil.pk %}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

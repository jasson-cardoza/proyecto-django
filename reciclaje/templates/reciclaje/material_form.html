{% extends 'base.html' %}
{% block title %}{% if material %}Editar{% else %}Nuevo{% endif %} material | ReciclaCerca{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <h2 class="titulo-seccion">{% if material %}Editar material{% else %}Nuevo material{% endif %}</h2>
    <form method="post" class="card card-body shadow-sm form-reciclaje">
      {% csrf_token %}
      {% include 'includes/campos.html' %}
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-reciclaje">Guardar</button>
        <a href="{% url 'reciclaje:material_list' %}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

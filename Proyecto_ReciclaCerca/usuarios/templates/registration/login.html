{% extends 'inicio/base.html' %}
{% block title %}Iniciar sesión | ReciclaCerca{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h2 class="titulo-seccion">Iniciar sesión</h2>
    <form method="post" class="card card-body shadow-sm form-reciclaje">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}" />
      {% include 'inicio/_campos.html' %}
      <button type="submit" class="btn btn-reciclaje">Entrar</button>
    </form>
    <p class="text-center mt-3">
      ¿No tienes cuenta? <a href="{% url 'usuarios:perfil_registro' %}">Regístrate</a>
    </p>
  </div>
</div>
{% endblock %}

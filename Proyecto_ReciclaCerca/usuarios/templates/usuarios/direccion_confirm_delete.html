{% extends 'inicio/base.html' %}
{% block title %}Eliminar dirección | ReciclaCerca{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <h2 class="titulo-seccion">Eliminar dirección</h2>
    <form method="post" class="card card-body shadow-sm">
      {% csrf_token %}
      <p>¿Eliminar la dirección <strong>{{ direccion.direccion_completa }}</strong>?</p>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'usuarios:direccion_list' %}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

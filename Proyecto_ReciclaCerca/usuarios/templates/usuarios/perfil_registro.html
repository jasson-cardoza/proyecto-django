{% extends 'inicio/base.html' %}
{% block title %}Crear cuenta | ReciclaCerca{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h2 class="titulo-seccion">Crear cuenta</h2>
    <form method="post" class="card card-body shadow-sm form-reciclaje">
      {% csrf_token %}
      {% include 'inicio/_campos.html' %}
      <button type="submit" class="btn btn-reciclaje">Registrarme</button>
    </form>
    <p class="text-center mt-3">
      ¿Ya tienes cuenta? <a href="{% url 'usuarios:login' %}">Inicia sesión</a>
    </p>
  </div>
</div>
{% endblock %}
